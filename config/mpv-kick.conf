# kick-player — included from mpv.conf
# Smooth playback + resume for Kick VODs

vo=gpu
hwdec=auto-safe
ao=pipewire

cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=256MiB
cache-secs=60
autosync=30
framedrop=vo

ytdl=yes
ytdl-format=bestvideo*[height<=1080]+bestaudio/best[height<=1080]/best

osc=yes
osd-level=1
geometry=65%x65%
keepaspect-window=yes

save-position-on-quit=yes
resume-playback=yes
write-filename-in-watch-later-config=yes
watch-later-dir=~~/watch_later
